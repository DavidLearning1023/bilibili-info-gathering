name: 功能建议 / Feature request
description: 加一个工具、改取数逻辑、要一个新能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先看 [CONTRIBUTING.md](https://github.com/DavidLearning1023/bilibili-info-gathering/blob/main/CONTRIBUTING.md)
        的「该往哪儿提」：**如果只是想改判据，请用「方法论讨论」模板**。

        加工具前请想清楚两件事：
        ① 动机——现在做不到什么？
        ② 成本——会多几次上游请求？要不要新的依赖？要不要改资产库结构？

        另外：**工具数变了要同步所有文档**（README 中英 / SKILL.md / INSTALL.md /
        `references/mcp-tools.md`），有 lint 会直接判失败。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to solve
      description: 不要写「加个 XXX 功能」，写「我想在什么场景下做不到什么」
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / Scenario
      description: 真实的一句提问或操作，越接近实际使用越好
      placeholder: "帮我在B站了解 X 时，我希望能……"
    validations:
      required: true

  - type: textarea
    id: cost
    attributes:
      label: 成本估算 / Cost estimate
      description: 多几次上游请求？要不要新依赖？要不要改资产库结构？会不会让 Agent 的上下文变长？
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案 / Alternatives you tried
    validations:
      required: false
